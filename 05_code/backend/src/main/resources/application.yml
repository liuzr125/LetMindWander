spring:
  application:
    name: let-mind-wander-backend
  profiles:
    active: dev,local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: 8025
  shutdown: graceful

app:
  privacy-version: ${PRIVACY_VERSION:PRIVACY_V1}
  admin-token: ${ADMIN_TOKEN:dev-admin-token}
  admin-principal-id: ${ADMIN_PRINCIPAL_ID:00000000000000000000000000000002}
  session-ttl: ${SESSION_TTL:P30D}
  registration-ttl: ${REGISTRATION_TTL:PT10M}
  registration-store: ${REGISTRATION_STORE:memory}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  wechat:
    # Default to the real WeChat phone-number API. Set WECHAT_MOCK_ENABLED=true only for isolated local tests.
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
  sms:
    # 本地开发可启用控制台短信；生产环境必须接入真实短信供应商并保持为 false。
    mock-enabled: ${SMS_MOCK_ENABLED:false}
    code-ttl: ${SMS_CODE_TTL:PT5M}
    resend-interval: ${SMS_RESEND_INTERVAL:PT60S}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    fixed-code: ${SMS_FIXED_CODE:}
  plan:
    # 计划数量上限的兜底默认值；app_parameter 表有同名参数时以表为准（plan.tech_count_max 等）。
    limits:
      tech-count-max: ${PLAN_TECH_COUNT_MAX:255}
      new-word-count-max: ${PLAN_NEW_WORD_COUNT_MAX:255}
      review-limit-max: ${PLAN_REVIEW_LIMIT_MAX:255}
  word-memory:
    enabled: ${WORD_MEMORY_ENABLED:true}
    listening-enabled: ${WORD_MEMORY_LISTENING_ENABLED:false}
    ai-enabled: ${WORD_MEMORY_AI_ENABLED:false}
    stable-label-enabled: ${WORD_MEMORY_STABLE_LABEL_ENABLED:false}
  ai:
    mock-enabled: ${AI_MOCK_ENABLED:false}
    # DeepSeek 官网价格每天北京时间 22:00 自动核验；失败时保留最后一个有效价格版本。
    pricing-sync-enabled: ${AI_PRICING_SYNC_ENABLED:true}
    pricing-sync-cron: "${AI_PRICING_SYNC_CRON:0 0 22 * * *}"
    personal-concurrency: ${AI_PERSONAL_CONCURRENCY:1}
    global-concurrency: ${AI_GLOBAL_CONCURRENCY:2}
    consent-version: ${AI_CONSENT_VERSION:AI_SEND_V1}
    # Web 端录入的供应商密钥使用 AES-GCM 加密后入库；未配置时禁止从 Web 写入密钥。
    credential-encryption-key: ${AI_CREDENTIAL_ENCRYPTION_KEY:}
  article-generation:
    # 22:30 运行，等待 22:00 官方 RSS 采集完成；每本有词条的词书每日生成 5 篇。
    enabled: ${ARTICLE_GENERATION_ENABLED:true}
    per-book-count: ${ARTICLE_GENERATION_PER_BOOK_COUNT:5}
    cron: "${ARTICLE_GENERATION_CRON:0 30 22 * * *}"
  media:
    # 阿里云 OSS：密钥仅从环境变量读取，不写入仓库。
    oss-endpoint: https://oss-cn-beijing.aliyuncs.com
    oss-bucket: let-mind-wander
    # 头像等私有图片的公网访问域名（bucket 公读时可等于 endpoint 域名）。
    public-base-url: ${MEDIA_BASE_URL:https://mindkitchen.vip.cpolar.cn/api/media}
  tts:
    mock-enabled: ${TTS_MOCK_ENABLED:false}
