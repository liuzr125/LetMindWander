spring:
  application:
    name: let-mind-wander-backend
  profiles:
    active: dev,local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: 8025
  shutdown: graceful

app:
  privacy-version: ${PRIVACY_VERSION:PRIVACY_V1}
  admin-token: ${ADMIN_TOKEN:dev-admin-token}
  admin-principal-id: ${ADMIN_PRINCIPAL_ID:00000000000000000000000000000002}
  session-ttl: ${SESSION_TTL:P30D}
  registration-ttl: ${REGISTRATION_TTL:PT10M}
  registration-store: ${REGISTRATION_STORE:memory}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  wechat:
    # Default to the real WeChat phone-number API. Set WECHAT_MOCK_ENABLED=true only for isolated local tests.
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
  sms:
    # 本地开发可启用控制台短信；生产环境必须接入真实短信供应商并保持为 false。
    mock-enabled: ${SMS_MOCK_ENABLED:false}
    code-ttl: ${SMS_CODE_TTL:PT5M}
    resend-interval: ${SMS_RESEND_INTERVAL:PT60S}
    max-attempts: ${SMS_MAX_ATTEMPTS:5}
    fixed-code: ${SMS_FIXED_CODE:}
  media:
    # 阿里云 OSS：密钥仅从环境变量读取，不写入仓库。
    oss-endpoint: https://oss-cn-beijing.aliyuncs.com
    oss-bucket: let-mind-wander
    # 头像等私有图片的公网访问域名（bucket 公读时可等于 endpoint 域名）。
    public-base-url: ${MEDIA_BASE_URL:https://13f59739.r7.vip.cpolar.cn/api/media}
